# Sidecar services — additional containers that extend Borg infrastructure.
#
# Usage: set COMPOSE_FILE=docker-compose.yml:docker-compose.services.yml
# or:    docker compose -f docker-compose.yml -f docker-compose.services.yml up
#
# Guidelines for adding services:
# - Use the `internal` network to reach broker and other Borg services
# - Set memory limits (deploy.resources.limits.memory)
# - Use named volumes for persistent data
# - Add healthchecks so dependents can use condition: service_healthy
# - Prefix service names with the project name to avoid conflicts

services:
  # ── ntfy: push notification server ──
  ntfy:
    image: binwiederhier/ntfy
    restart: unless-stopped
    command: serve
    environment:
      - NTFY_BASE_URL=${NTFY_BASE_URL:-http://ntfy:80}
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
      - NTFY_BEHIND_PROXY=true
    volumes:
      - ntfy-cache:/var/cache/ntfy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "http://localhost:80/v1/health", "-O", "/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  ntfy-cache:

networks:
  internal: {}

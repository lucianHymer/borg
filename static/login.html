<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borg Dashboard - Login</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent-green: #3fb950;
  --accent-blue: #58a6ff;
  --accent-red: #f85149;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 40px;
  width: 100%;
  max-width: 380px;
  margin: 16px;
}

.title {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-blue);
  margin-bottom: 8px;
}

.subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 28px;
}

input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 18px;
  letter-spacing: 0.3em;
  text-align: center;
  outline: none;
  transition: border-color 0.15s;
}

input[type="text"]::placeholder {
  font-size: 13px;
  letter-spacing: normal;
  color: var(--text-secondary);
}

input[type="text"]:focus {
  border-color: var(--accent-blue);
}

button {
  width: 100%;
  margin-top: 16px;
  padding: 10px;
  background: var(--accent-blue);
  border: none;
  border-radius: 6px;
  color: var(--bg-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.15s;
}

button:hover { opacity: 0.85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.error {
  display: none;
  margin-top: 16px;
  padding: 10px;
  background: rgba(248, 81, 73, 0.1);
  border: 1px solid var(--accent-red);
  border-radius: 6px;
  color: var(--accent-red);
  font-size: 12px;
  text-align: center;
}

.error.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="title">Borg Dashboard</div>
  <div class="subtitle">Enter your auth code from /authcode in Telegram</div>
  <form id="login-form">
    <input type="text" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autofocus autocomplete="off">
    <button type="submit">Login</button>
  </form>
  <div class="error" id="error"></div>
</div>
<script>
const form = document.getElementById('login-form');
const codeInput = document.getElementById('code');
const errorEl = document.getElementById('error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = codeInput.value.trim();
  if (!code) return;

  errorEl.classList.remove('visible');
  const btn = form.querySelector('button');
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const res = await fetch('/auth/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });

    if (res.ok) {
      // Cookie set server-side via Set-Cookie header (HttpOnly, not accessible to JS)
      window.location.href = '/';
    } else if (res.status === 429) {
      showError('Too many attempts');
    } else {
      showError('Invalid or expired code');
    }
  } catch {
    showError('Connection error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Login';
  }
});

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('visible');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Response Detail — Borg</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent-green: #3fb950;
  --accent-blue: #58a6ff;
  --accent-purple: #bc8cff;
  --accent-red: #f85149;
  --accent-yellow: #d29922;
  --accent-orange: #d18616;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  overflow-y: auto;
}

/* ─── Navbar ─── */

#navbar {
  display: flex;
  align-items: center;
  height: 40px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  gap: 8px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}

#navbar .brand {
  font-weight: 700;
  font-size: 14px;
  color: var(--accent-blue);
  margin-right: 8px;
  white-space: nowrap;
  text-decoration: none;
}

#navbar .breadcrumb {
  color: var(--text-secondary);
  font-size: 12px;
}

#navbar .breadcrumb a {
  color: var(--text-secondary);
  text-decoration: none;
}

#navbar .breadcrumb a:hover { color: var(--text-primary); }

#status-badge {
  margin-left: auto;
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}

.status-live {
  background: rgba(63, 185, 80, 0.15);
  color: var(--accent-green);
  border: 1px solid rgba(63, 185, 80, 0.3);
}

.status-complete {
  background: rgba(88, 166, 255, 0.15);
  color: var(--accent-blue);
  border: 1px solid rgba(88, 166, 255, 0.3);
}

.status-not-found {
  background: rgba(248, 81, 73, 0.15);
  color: var(--accent-red);
  border: 1px solid rgba(248, 81, 73, 0.3);
}

/* ─── Main Content ─── */

#main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

.section {
  margin-bottom: 24px;
}

.section-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

/* ─── Stats Grid ─── */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
}

.stat-label {
  font-size: 11px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  margin-bottom: 4px;
}

.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-primary);
}

.stat-value.cost { color: var(--accent-green); }
.stat-value.tokens { color: var(--accent-blue); }
.stat-value.duration { color: var(--accent-purple); }
.stat-value.model { color: var(--accent-yellow); font-size: 16px; }

.stat-sub {
  font-size: 10px;
  color: var(--text-secondary);
  margin-top: 2px;
}

/* ─── Message Bubbles ─── */

.message-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 16px;
  overflow: hidden;
}

.message-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.message-header .label {
  font-weight: 600;
}

.message-header .label.in { color: var(--accent-blue); }
.message-header .label.out { color: var(--accent-green); }

.message-header .meta {
  color: var(--text-secondary);
  margin-left: auto;
  font-size: 11px;
}

.message-body {
  padding: 16px;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
}

/* ─── Background Tasks ─── */

.task-list { list-style: none; }

.task-item {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-status-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.task-status-running {
  background: rgba(63, 185, 80, 0.15);
  color: var(--accent-green);
  border: 1px solid rgba(63, 185, 80, 0.3);
}

.task-status-completed {
  background: rgba(88, 166, 255, 0.15);
  color: var(--accent-blue);
  border: 1px solid rgba(88, 166, 255, 0.3);
}

.task-status-failed {
  background: rgba(248, 81, 73, 0.15);
  color: var(--accent-red);
  border: 1px solid rgba(248, 81, 73, 0.3);
}

.task-status-stopped {
  background: rgba(210, 153, 34, 0.15);
  color: var(--accent-yellow);
  border: 1px solid rgba(210, 153, 34, 0.3);
}

.task-info { flex: 1; min-width: 0; }

.task-description {
  font-size: 13px;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.task-meta {
  font-size: 11px;
  color: var(--text-secondary);
}

.task-summary {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
  white-space: pre-wrap;
  word-break: break-word;
}

.task-stop-btn {
  background: rgba(248, 81, 73, 0.15);
  color: var(--accent-red);
  border: 1px solid rgba(248, 81, 73, 0.3);
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
  cursor: pointer;
  flex-shrink: 0;
}

.task-stop-btn:hover {
  background: rgba(248, 81, 73, 0.3);
}

.task-stop-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ─── Model Usage Breakdown ─── */

.model-breakdown {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.model-breakdown table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.model-breakdown th {
  text-align: left;
  padding: 8px 12px;
  background: var(--bg-tertiary);
  color: var(--text-secondary);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  border-bottom: 1px solid var(--border);
}

.model-breakdown td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  color: var(--text-primary);
}

.model-breakdown tr:last-child td { border-bottom: none; }

/* ─── Session Log ─── */

.session-log {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}

.log-entries {
  padding: 8px 0;
}

.log-entry {
  padding: 4px 16px;
  font-size: 12px;
  border-bottom: 1px solid rgba(48, 54, 61, 0.4);
  display: flex;
  gap: 8px;
  align-items: baseline;
}

.log-entry:last-child { border-bottom: none; }

.log-entry .log-type {
  font-weight: 600;
  min-width: 100px;
  flex-shrink: 0;
  font-size: 11px;
}

.log-entry .log-content {
  color: var(--text-secondary);
  white-space: pre-wrap;
  word-break: break-word;
  flex: 1;
}

.log-type-assistant { color: var(--accent-green); }
.log-type-tool_use { color: var(--accent-yellow); }
.log-type-tool_result { color: var(--accent-orange); }
.log-type-user { color: var(--accent-blue); }
.log-type-result { color: var(--accent-purple); }
.log-type-system { color: var(--text-secondary); }

/* ─── Live Indicator ─── */

.live-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  display: inline-block;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ─── Loading / Empty States ─── */

.loading {
  text-align: center;
  padding: 48px;
  color: var(--text-secondary);
}

.not-found {
  text-align: center;
  padding: 48px;
  color: var(--text-secondary);
}

.not-found h2 {
  color: var(--accent-red);
  margin-bottom: 8px;
  font-size: 16px;
}
</style>
</head>
<body>

<div id="navbar">
  <a href="/" class="brand">BORG</a>
  <span class="breadcrumb">
    <a href="/">Dashboard</a> / Response Detail
  </span>
  <span id="status-badge"></span>
</div>

<div id="main">
  <div id="loading" class="loading">Loading response data...</div>
  <div id="not-found" class="not-found" style="display:none">
    <h2>Response Not Found</h2>
    <p>This response may have been rotated out of history.</p>
  </div>
  <div id="content" style="display:none">

    <!-- Stats Overview -->
    <div class="section">
      <div class="section-header">Overview</div>
      <div id="stats-grid" class="stats-grid"></div>
    </div>

    <!-- Incoming Message -->
    <div class="section">
      <div class="section-header">Prompt</div>
      <div id="incoming-card" class="message-card">
        <div class="message-header">
          <span class="label in" id="incoming-sender">User</span>
          <span class="meta" id="incoming-meta"></span>
        </div>
        <div class="message-body" id="incoming-body"></div>
      </div>
    </div>

    <!-- Outgoing Message -->
    <div class="section">
      <div class="section-header">Response</div>
      <div id="outgoing-card" class="message-card">
        <div class="message-header">
          <span class="label out">Assistant</span>
          <span class="meta" id="outgoing-meta"></span>
        </div>
        <div class="message-body" id="outgoing-body"></div>
      </div>
    </div>

    <!-- Background Tasks -->
    <div class="section" id="tasks-section" style="display:none">
      <div class="section-header">Background Tasks</div>
      <ul class="task-list" id="task-list"></ul>
    </div>

    <!-- Model Usage Breakdown -->
    <div class="section" id="breakdown-section" style="display:none">
      <div class="section-header">Model Usage Breakdown</div>
      <div class="model-breakdown">
        <table id="breakdown-table">
          <thead>
            <tr>
              <th>Model</th>
              <th>Input</th>
              <th>Output</th>
              <th>Cache Read</th>
              <th>Cache Write</th>
              <th>Cost</th>
            </tr>
          </thead>
          <tbody id="breakdown-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Session Log -->
    <div class="section">
      <div class="section-header">Session Log <span id="log-count" style="color:var(--text-secondary);font-weight:400"></span></div>
      <div class="session-log">
        <div class="log-entries" id="log-entries"></div>
      </div>
    </div>

  </div>
</div>

<script>
const messageId = window.location.pathname.split('/').pop();
const badge = document.getElementById('status-badge');
const loading = document.getElementById('loading');
const notFound = document.getElementById('not-found');
const content = document.getElementById('content');
const logEntries = document.getElementById('log-entries');
const logCount = document.getElementById('log-count');

let isLive = false;
let logCounter = 0;

function formatNumber(n) {
  if (n == null) return '—';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
  return n.toLocaleString();
}

function formatCost(n) {
  if (n == null) return '—';
  if (n < 0.01) return '$' + n.toFixed(4);
  return '$' + n.toFixed(3);
}

function formatDuration(ms) {
  if (ms == null) return '—';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  return (ms / 60000).toFixed(1) + 'm';
}

function formatTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleString(undefined, {
    month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function friendlyModel(m) {
  if (!m) return 'Unknown';
  const l = m.toLowerCase();
  if (l.includes('opus')) return 'Opus';
  if (l.includes('sonnet')) return 'Sonnet';
  if (l.includes('haiku')) return 'Haiku';
  if (l.includes('minimax')) return 'M2.5';
  return m;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderStats(data) {
  const out = data.outgoing || {};
  const grid = document.getElementById('stats-grid');

  const stats = [
    { label: 'Cost', value: formatCost(out.costUSD), cls: 'cost' },
    { label: 'Model', value: friendlyModel(out.model), cls: 'model' },
    { label: 'Input Tokens', value: formatNumber(out.inputTokens), cls: 'tokens',
      sub: out.cacheReadInputTokens ? `${formatNumber(out.cacheReadInputTokens)} cache read` : null },
    { label: 'Output Tokens', value: formatNumber(out.outputTokens), cls: 'tokens' },
    { label: 'Cache Write', value: formatNumber(out.cacheCreationInputTokens), cls: 'tokens' },
    { label: 'Duration', value: formatDuration(out.durationMs), cls: 'duration',
      sub: out.durationApiMs ? `API: ${formatDuration(out.durationApiMs)}` : null },
    { label: 'Turns', value: out.numTurns != null ? String(out.numTurns) : '—', cls: 'tokens' },
    { label: 'Thread', value: data.threadName || `Thread ${data.threadId}`, cls: 'model' },
    { label: 'Source', value: out.source || 'user', cls: 'model' },
  ];

  grid.innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value ${s.cls}">${s.value}</div>
      ${s.sub ? `<div class="stat-sub">${s.sub}</div>` : ''}
    </div>
  `).join('');
}

function renderMessages(data) {
  if (data.incoming) {
    document.getElementById('incoming-sender').textContent = data.incoming.sender || 'User';
    document.getElementById('incoming-meta').textContent = formatTime(data.incoming.ts);
    document.getElementById('incoming-body').textContent = data.incoming.message || '';
  } else {
    document.getElementById('incoming-card').style.display = 'none';
  }

  if (data.outgoing) {
    document.getElementById('outgoing-meta').textContent = formatTime(data.outgoing.ts);
    document.getElementById('outgoing-body').textContent = data.outgoing.message || '';
  } else {
    document.getElementById('outgoing-body').textContent = 'Waiting for response...';
    document.getElementById('outgoing-body').style.color = 'var(--text-secondary)';
    document.getElementById('outgoing-body').style.fontStyle = 'italic';
  }
}

function renderBreakdown(modelUsage) {
  if (!modelUsage || Object.keys(modelUsage).length === 0) return;

  document.getElementById('breakdown-section').style.display = '';
  const tbody = document.getElementById('breakdown-body');
  tbody.innerHTML = Object.entries(modelUsage).map(([model, u]) => `
    <tr>
      <td>${escapeHtml(friendlyModel(model))}</td>
      <td>${formatNumber(u.inputTokens)}</td>
      <td>${formatNumber(u.outputTokens)}</td>
      <td>${formatNumber(u.cacheReadInputTokens)}</td>
      <td>${formatNumber(u.cacheCreationInputTokens)}</td>
      <td>${formatCost(u.costUSD)}</td>
    </tr>
  `).join('');
}

function renderSessionLogs(lines) {
  for (const line of lines) {
    appendLogEntry(line);
  }
}

function appendLogEntry(lineStr) {
  let entry;
  try {
    entry = typeof lineStr === 'string' ? JSON.parse(lineStr) : lineStr;
  } catch { return; }

  logCounter++;
  logCount.textContent = `(${logCounter})`;

  const div = document.createElement('div');
  div.className = 'log-entry';

  const type = entry.type || 'unknown';
  let typeClass = 'log-type-system';
  let displayType = type;
  let contentText = '';

  if (type === 'assistant') {
    typeClass = 'log-type-assistant';
    displayType = 'assistant';
    if (entry.message?.content) {
      const parts = Array.isArray(entry.message.content)
        ? entry.message.content
        : [entry.message.content];
      const texts = parts.map(p => {
        if (typeof p === 'string') return p;
        if (p.type === 'text') return p.text || '';
        if (p.type === 'tool_use') return `[tool: ${p.name}(${JSON.stringify(p.input || {}).slice(0, 120)})]`;
        return JSON.stringify(p).slice(0, 120);
      });
      contentText = texts.join(' ');
    }
  } else if (type === 'tool_use') {
    typeClass = 'log-type-tool_use';
    displayType = 'tool_use';
    contentText = entry.name || '';
    if (entry.input) {
      contentText += ' ' + JSON.stringify(entry.input);
    }
  } else if (type === 'tool_result') {
    typeClass = 'log-type-tool_result';
    displayType = 'tool_result';
    const content = entry.content || entry.output || '';
    contentText = typeof content === 'string' ? content : JSON.stringify(content);
  } else if (type === 'user') {
    typeClass = 'log-type-user';
    displayType = 'user';
    if (entry.message?.content) {
      contentText = typeof entry.message.content === 'string'
        ? entry.message.content
        : JSON.stringify(entry.message.content);
    }
  } else if (type === 'result') {
    typeClass = 'log-type-result';
    displayType = 'result';
    if (entry.subtype) displayType += ` (${entry.subtype})`;
    if (entry.cost_usd != null) {
      contentText = `cost=$${entry.cost_usd.toFixed(4)}`;
    }
    if (entry.duration_ms != null) {
      contentText += ` duration=${(entry.duration_ms / 1000).toFixed(1)}s`;
    }
    if (entry.usage) {
      contentText += ` in=${formatNumber(entry.usage.input_tokens)} out=${formatNumber(entry.usage.output_tokens)}`;
    }
  } else {
    contentText = JSON.stringify(entry).slice(0, 300);
  }

  div.innerHTML = `
    <span class="log-type ${typeClass}">${escapeHtml(displayType)}</span>
    <span class="log-content">${escapeHtml(contentText)}</span>
  `;
  logEntries.appendChild(div);
}

function renderBackgroundTasks(taskData) {
  if (!taskData || !taskData.tasks) return;
  const tasks = Object.values(taskData.tasks);
  if (tasks.length === 0) return;

  document.getElementById('tasks-section').style.display = '';
  const list = document.getElementById('task-list');

  list.innerHTML = tasks.map(t => {
    const elapsed = t.startedAt ? formatDuration(Date.now() - t.startedAt) : '';
    const statusClass = `task-status-${t.status}`;
    const showStop = t.status === 'running';
    const usageInfo = t.usage
      ? `${formatNumber(t.usage.totalTokens)} tokens, ${t.usage.toolUses} tools`
      : '';

    return `
      <li class="task-item" data-task-id="${escapeHtml(t.taskId)}">
        <span class="task-status-badge ${statusClass}">${escapeHtml(t.status)}</span>
        <div class="task-info">
          <div class="task-description">${escapeHtml(t.description)}</div>
          <div class="task-meta">
            ${elapsed ? `Running for ${elapsed}` : ''}
            ${usageInfo ? ` | ${usageInfo}` : ''}
            ${t.lastToolName ? ` | Last: ${escapeHtml(t.lastToolName)}` : ''}
          </div>
          ${t.summary ? `<div class="task-summary">${escapeHtml(t.summary)}</div>` : ''}
        </div>
        ${showStop ? `<button class="task-stop-btn" onclick="stopTask('${escapeHtml(t.taskId)}', this)">Stop</button>` : ''}
      </li>
    `;
  }).join('');
}

async function stopTask(taskId, btn) {
  btn.disabled = true;
  btn.textContent = 'Stopping...';
  try {
    const resp = await fetch(`/api/background-tasks/${taskId}/stop`, { method: 'POST' });
    if (!resp.ok) {
      btn.textContent = 'Failed';
    }
  } catch {
    btn.textContent = 'Error';
  }
}

function setBadge(status, text) {
  badge.className = `status-${status}`;
  badge.innerHTML = status === 'live'
    ? `<span class="live-dot"></span> ${text}`
    : text;
}

// ─── Initial Load ───

async function init() {
  try {
    const resp = await fetch(`/api/response/${messageId}`);
    if (resp.status === 404) {
      loading.style.display = 'none';
      notFound.style.display = '';
      setBadge('not-found', 'Not Found');
      return;
    }

    const data = await resp.json();
    loading.style.display = 'none';
    content.style.display = '';

    document.title = `Response — ${data.threadName || messageId} — Borg`;

    renderStats(data);
    renderMessages(data);

    if (data.outgoing?.modelUsage) {
      renderBreakdown(data.outgoing.modelUsage);
    }

    if (data.backgroundTasks) {
      renderBackgroundTasks(data.backgroundTasks);
    }

    if (data.sessionLogs && data.sessionLogs.length > 0) {
      renderSessionLogs(data.sessionLogs);
    }

    // Determine if this is still live (no outgoing entry yet, or background tasks running)
    const hasRunningTasks = data.backgroundTasks?.tasks &&
      Object.values(data.backgroundTasks.tasks).some(t => t.status === 'running');
    if (!data.outgoing || hasRunningTasks) {
      setBadge('live', 'Processing');
      startLiveFeed();
    } else {
      setBadge('complete', 'Complete');
    }

  } catch (err) {
    loading.textContent = 'Error loading response data.';
    console.error(err);
  }
}

// ─── Live SSE Feed ───

function startLiveFeed() {
  isLive = true;
  const es = new EventSource(`/api/response/${messageId}/feed`);

  es.addEventListener('status', (e) => {
    try {
      const status = JSON.parse(e.data);
      const elapsed = status.startTs
        ? formatDuration(Date.now() - status.startTs)
        : '';
      setBadge('live', `${status.label || 'Processing'} ${elapsed}`);

      if (status.preview) {
        const body = document.getElementById('outgoing-body');
        body.textContent = status.preview;
        body.style.color = '';
        body.style.fontStyle = '';
      }
    } catch { /* ignore */ }
  });

  es.addEventListener('background-tasks', (e) => {
    try {
      const data = JSON.parse(e.data);
      renderBackgroundTasks(data);
    } catch { /* ignore */ }
  });

  es.addEventListener('session-log', (e) => {
    appendLogEntry(e.data);
    // Auto-scroll log
    const el = document.getElementById('log-entries');
    el.scrollTop = el.scrollHeight;
  });

  es.addEventListener('complete', (e) => {
    try {
      const outgoing = JSON.parse(e.data);
      setBadge('complete', 'Complete');
      isLive = false;
      es.close();

      // Update response body
      document.getElementById('outgoing-body').textContent = outgoing.message || '';
      document.getElementById('outgoing-body').style.color = '';
      document.getElementById('outgoing-body').style.fontStyle = '';
      document.getElementById('outgoing-meta').textContent = formatTime(outgoing.ts);

      // Re-fetch full data to update stats
      fetch(`/api/response/${messageId}`).then(r => r.json()).then(data => {
        renderStats(data);
        if (data.outgoing?.modelUsage) renderBreakdown(data.outgoing.modelUsage);
      });
    } catch { /* ignore */ }
  });

  es.onerror = () => {
    if (isLive) {
      // Will auto-reconnect
      setBadge('live', 'Reconnecting...');
    }
  };
}

init();
</script>
</body>
</html>

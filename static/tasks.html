<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Tasks — Borg</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #21262d;
  --border: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent-green: #3fb950;
  --accent-blue: #58a6ff;
  --accent-purple: #bc8cff;
  --accent-red: #f85149;
  --accent-yellow: #d29922;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
}

#navbar {
  display: flex;
  align-items: center;
  height: 40px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 100;
}

#navbar .brand {
  font-weight: 700;
  font-size: 14px;
  color: var(--accent-blue);
  margin-right: 8px;
  text-decoration: none;
}

#navbar .breadcrumb {
  color: var(--text-secondary);
  font-size: 12px;
}

#navbar .breadcrumb a {
  color: var(--text-secondary);
  text-decoration: none;
}

#navbar .breadcrumb a:hover { color: var(--text-primary); }

#task-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-secondary);
}

#main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 24px;
}

.empty {
  text-align: center;
  padding: 48px;
  color: var(--text-secondary);
}

.task-card {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-status-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}

.task-status-running { background: rgba(63,185,80,0.15); color: var(--accent-green); border: 1px solid rgba(63,185,80,0.3); }
.task-status-completed { background: rgba(88,166,255,0.15); color: var(--accent-blue); border: 1px solid rgba(88,166,255,0.3); }
.task-status-failed { background: rgba(248,81,73,0.15); color: var(--accent-red); border: 1px solid rgba(248,81,73,0.3); }
.task-status-stopped { background: rgba(210,153,34,0.15); color: var(--accent-yellow); border: 1px solid rgba(210,153,34,0.3); }

.task-info { flex: 1; min-width: 0; }

.task-description {
  font-size: 13px;
  color: var(--text-primary);
  margin-bottom: 2px;
}

.task-meta {
  font-size: 11px;
  color: var(--text-secondary);
}

.task-meta a {
  color: var(--accent-blue);
  text-decoration: none;
}

.task-meta a:hover { text-decoration: underline; }

.task-summary {
  font-size: 11px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.task-stop-btn {
  background: rgba(248,81,73,0.15);
  color: var(--accent-red);
  border: 1px solid rgba(248,81,73,0.3);
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
  cursor: pointer;
  flex-shrink: 0;
}

.task-stop-btn:hover { background: rgba(248,81,73,0.3); }
.task-stop-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.section-header {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
</style>
</head>
<body>

<div id="navbar">
  <a href="/" class="brand">BORG</a>
  <span class="breadcrumb">
    <a href="/">Dashboard</a> / Background Tasks
  </span>
  <span id="task-count"></span>
</div>

<div id="main">
  <div id="loading" class="empty">Loading tasks...</div>
  <div id="empty" class="empty" style="display:none">No active background tasks.</div>
  <div id="content" style="display:none">
    <div class="section-header">Active Tasks</div>
    <div id="task-list"></div>
  </div>
</div>

<script>
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function formatDuration(ms) {
  if (ms == null) return '';
  if (ms < 1000) return ms + 'ms';
  if (ms < 60000) return (ms / 1000).toFixed(1) + 's';
  if (ms < 3600000) return (ms / 60000).toFixed(1) + 'm';
  return (ms / 3600000).toFixed(1) + 'h';
}

function formatNumber(n) {
  if (n == null) return '';
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n.toLocaleString();
}

function renderTasks(taskStates) {
  const allTasks = [];
  for (const state of taskStates) {
    for (const [taskId, task] of Object.entries(state.tasks)) {
      allTasks.push({ ...task, taskId, threadId: state.threadId, messageId: state.messageId });
    }
  }

  const loading = document.getElementById('loading');
  const empty = document.getElementById('empty');
  const content = document.getElementById('content');
  const taskCount = document.getElementById('task-count');
  const list = document.getElementById('task-list');

  loading.style.display = 'none';

  if (allTasks.length === 0) {
    empty.style.display = '';
    content.style.display = 'none';
    taskCount.textContent = '';
    return;
  }

  empty.style.display = 'none';
  content.style.display = '';

  const running = allTasks.filter(t => t.status === 'running').length;
  taskCount.textContent = running > 0 ? `${running} running` : `${allTasks.length} total`;

  // Sort: running first, then by startedAt desc
  allTasks.sort((a, b) => {
    if (a.status === 'running' && b.status !== 'running') return -1;
    if (a.status !== 'running' && b.status === 'running') return 1;
    return (b.startedAt || 0) - (a.startedAt || 0);
  });

  list.innerHTML = allTasks.map(t => {
    const elapsed = t.startedAt ? formatDuration(Date.now() - t.startedAt) : '';
    const statusClass = `task-status-${t.status}`;
    const showStop = t.status === 'running';
    const usageInfo = t.usage
      ? `${formatNumber(t.usage.totalTokens)} tokens, ${t.usage.toolUses} tools`
      : '';

    return `
      <div class="task-card">
        <span class="task-status-badge ${statusClass}">${escapeHtml(t.status)}</span>
        <div class="task-info">
          <div class="task-description">${escapeHtml(t.description)}</div>
          <div class="task-meta">
            Thread ${t.threadId}
            ${elapsed ? ` | ${elapsed}` : ''}
            ${usageInfo ? ` | ${usageInfo}` : ''}
            ${t.lastToolName ? ` | ${escapeHtml(t.lastToolName)}` : ''}
            | <a href="/response/${encodeURIComponent(t.messageId)}">View Response</a>
          </div>
          ${t.summary ? `<div class="task-summary">${escapeHtml(t.summary)}</div>` : ''}
        </div>
        ${showStop ? `<button class="task-stop-btn" data-stop-task="${escapeHtml(t.taskId)}">Stop</button>` : ''}
      </div>
    `;
  }).join('');
}

// Event delegation for stop buttons
document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-stop-task]');
  if (!btn) return;
  const taskId = btn.dataset.stopTask;
  btn.disabled = true;
  btn.textContent = 'Stopping...';
  try {
    await fetch(`/api/background-tasks/${encodeURIComponent(taskId)}/stop`, { method: 'POST' });
  } catch {}
});

async function poll() {
  try {
    const resp = await fetch('/api/background-tasks');
    const data = await resp.json();
    renderTasks(data.taskStates || []);
  } catch {
    document.getElementById('loading').textContent = 'Error loading tasks.';
  }
}

// Initial load + poll every 5s
poll();
setInterval(poll, 5000);
</script>
</body>
</html>

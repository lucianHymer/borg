services:
  # ── Init: ensure zone directories, config files, and migrations ──
  init:
    image: node:22-slim
    volumes:
      - .:/project
    entrypoint: ["bash", "/project/scripts/init-zones.sh", "/project"]
    restart: "no"

  broker:
    build: ./broker
    restart: always
    volumes:
      - ./secrets/github-app.pem:/secrets/github-app.pem:ro
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - BROKER_SECRET=${BROKER_SECRET}
    networks:
      - internal
      - dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Infra: telegram-client + routing (no SDK, no agent sessions) ──
  infra:
    build:
      context: .
      dockerfile: Dockerfile.infra
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      speaches:
        condition: service_started
    volumes:
      - ./.borg-infra:/app/.borg-infra
      - ./.borg-infra:/app/.borg
      - ./.borg-core:/app/.borg-core
      - ./.borg-perimeter:/app/.borg-perimeter
      - ./threads.json:/app/threads.json
      - ./zone-config.json:/app/zone-config.json
      - ./settings.json:/app/settings.json
      - ${CLAUDE_CREDENTIALS}:/home/node/.claude/.credentials.json:ro
    environment:
      - NODE_ENV=production
      - BORG_ZONE=infra
      - ZONE_CONFIG_PATH=/app/zone-config.json
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Core: agent SDK sessions for trusted threads ──
  core:
    build: .
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      infra:
        condition: service_started
    volumes:
      - ./.borg-core:/app/.borg
      - ./threads.json:/app/threads.json
      - ./zone-config.json:/app/zone-config.json
      - ./settings.json:/app/settings.json
      # Workspace access
      - ${WORKSPACE_ROOT}:${WORKSPACE_ROOT}
      # Credentials
      - ./secrets/github-installations.json:/secrets/github-installations.json:ro
      - ${CLAUDE_CREDENTIALS}:/home/node/.claude/.credentials.json
      - ./skills/global:/home/node/.claude/skills:ro
      - claude-plugins-core:/home/node/.claude/plugins
    environment:
      - NODE_ENV=production
      - BORG_ZONE=core
      - ZONE_CONFIG_PATH=/app/zone-config.json
      - DEFAULT_CWD=${WORKSPACE_ROOT}
      - CREDENTIAL_BROKER_URL=http://broker:3000
      - BROKER_SECRET=${BROKER_SECRET}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - DEV_NETWORK=borg_dev
      - DOCKER_PROXY_URL=http://docker-proxy:2375/v1.47
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Perimeter: agent SDK sessions for untrusted threads ──
  perimeter:
    build: .
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      infra:
        condition: service_started
    volumes:
      - ./.borg-perimeter:/app/.borg
      - ./threads.json:/app/threads.json
      - ./zone-config.json:/app/zone-config.json
      - ./settings.json:/app/settings.json
      # Workspace access (sandboxed by Claude Code)
      - ${WORKSPACE_ROOT}:${WORKSPACE_ROOT}
      # Credentials (limited)
      - ./secrets/github-installations.json:/secrets/github-installations.json:ro
      - ${CLAUDE_CREDENTIALS}:/home/node/.claude/.credentials.json
      - claude-plugins-perimeter:/home/node/.claude/plugins
      # NO SSH keys, NO docker-proxy access
    environment:
      - NODE_ENV=production
      - BORG_ZONE=perimeter
      - ZONE_CONFIG_PATH=/app/zone-config.json
      - DEFAULT_CWD=${WORKSPACE_ROOT}
      - CREDENTIAL_BROKER_URL=http://broker:3000
      - BROKER_SECRET=${BROKER_SECRET}
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  docker-proxy:
    image: wollomatic/socket-proxy:1
    group_add:
      - "${DOCKER_GID}"
    command:
      - "-listenip=0.0.0.0"
      - "-allowfrom=0.0.0.0/0"
      - "-allowhealthcheck"
      - "-allowGET=/v1\\..{1,2}/(containers/json.*|containers/[a-f0-9]+/(json|stats.*)|_ping)"
      - "-allowPOST=/v1\\..{1,2}/containers/([a-f0-9]+/(update|start|stop)|create.*)"
      - "-allowDELETE=/v1\\..{1,2}/containers/[a-f0-9]+.*"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: always
    depends_on:
      init:
        condition: service_completed_successfully
      infra:
        condition: service_started
      docker-proxy:
        condition: service_healthy
    volumes:
      - ./.borg-core:/app/.borg:ro
      - ./.borg-core:/app/.borg-core:ro
      - ./.borg-perimeter:/app/.borg-perimeter:ro
      - ./.borg-infra:/app/.borg-infra:ro
      # rw mounts for background task stop signals (dashboard writes, queue-processor reads)
      - ./.borg-core/queue/task-stop:/app/.borg-core/queue/task-stop
      - ./.borg-perimeter/queue/task-stop:/app/.borg-perimeter/queue/task-stop
      - ./threads.json:/app/threads.json:ro
      - ./zone-config.json:/app/zone-config.json:ro
      - ./settings.json:/app/settings.json:ro
      - ${WORKSPACE_ROOT:-/home/lucian/workspace}:/home/lucian/workspace:ro
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - DOCKER_PROXY_URL=http://docker-proxy:2375/v1.47
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-borg}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      - KOKORO__VOICES=bf_alice
      - WHISPER__COMPUTE_TYPE=int8
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - dashboard
    networks:
      - internal

networks:
  internal:
    driver: bridge
  dev:
    driver: bridge

volumes:
  speaches-cache:
  claude-plugins-core:
  claude-plugins-perimeter:

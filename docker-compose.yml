services:
  # ── Init: ensure zone directories, config files, and migrations ──
  # Uses the dashboard image so the compiled TS supervisor
  # (dist/scripts/ensure-zone-containers.js) is available alongside
  # scripts/init-zones.sh.
  init:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    depends_on:
      docker-proxy:
        condition: service_healthy
    volumes:
      - ./.borg-zones:/app/.borg-zones
      - ./.borg-infra:/app/.borg-infra
      - ./threads.json:/app/threads.json
      - ./zone-config.json:/app/zone-config.json
      - ./zone-templates.json:/app/zone-templates.json:ro
      - ./settings.json:/app/settings.json
      - ./zone-config.example.json:/app/zone-config.example.json:ro
      - ./scripts:/app/scripts:ro
      - ./skills:/app/skills:ro
      - ${WORKSPACE_HOST_BASE}:/host-workspaces
      - ${CLAUDE_CREDENTIALS}:/home/node/.claude/.credentials.json:ro
    environment:
      - BORG_REPO_ROOT=${BORG_REPO_ROOT}
      - WORKSPACE_HOST_BASE=${WORKSPACE_HOST_BASE}
      - WORKSPACE_ROOT=${WORKSPACE_ROOT}
      - BROKER_SECRET=${BROKER_SECRET}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - CLAUDE_CREDENTIALS=${CLAUDE_CREDENTIALS}
      - DOCKER_PROXY_URL=http://docker-proxy:2375/v1.47
      - ZONE_CONFIG_PATH=/app/zone-config.json
      - ZONE_TEMPLATES_PATH=/app/zone-templates.json
    entrypoint: ["bash", "-c", "bash /app/scripts/init-zones.sh /app && node /app/dist/scripts/ensure-zone-containers.js"]
    networks:
      - internal
    restart: "no"

  broker:
    build: ./broker
    restart: always
    volumes:
      - ./secrets/github-app.pem:/secrets/github-app.pem:ro
    environment:
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - BROKER_SECRET=${BROKER_SECRET}
    networks:
      - internal
      - dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Infra: telegram-client + routing (no SDK, no agent sessions) ──
  infra:
    build:
      context: .
      dockerfile: Dockerfile.infra
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      speaches:
        condition: service_started
    volumes:
      - ./.borg-infra:/app/.borg-infra
      - ./.borg-infra:/app/.borg
      - ./.borg-zones:/app/.borg-zones:ro
      - ./threads.json:/app/threads.json
      - ./zone-config.json:/app/zone-config.json
      - ./zone-templates.json:/app/zone-templates.json:ro
      - ./settings.json:/app/settings.json
      - ${CLAUDE_CREDENTIALS}:/home/node/.claude/.credentials.json:ro
    environment:
      - NODE_ENV=production
      - BORG_ZONE=infra
      - ZONE_CONFIG_PATH=/app/zone-config.json
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Core: agent SDK sessions for trusted threads ──
  core:
    image: borg-agent:latest
    build: .
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      infra:
        condition: service_started
    volumes:
      - ./.borg-zones/core:/app/.borg
      - ./threads.json:/app/threads.json
      - ./zone-config.json:/app/zone-config.json:ro
      - ./settings.json:/app/settings.json
      # Workspace access (AD7: per-zone host workspace)
      - ${WORKSPACE_HOST_BASE}/workspace-core:${WORKSPACE_ROOT}
      # Credentials
      - ./secrets/github-installations.json:/secrets/github-installations.json:ro
      - ${CLAUDE_CREDENTIALS}:/home/node/.claude/.credentials.json
      - ./.borg-zones/core/claude-skills:/home/node/.claude/skills
      - claude-plugins-core:/home/node/.claude/plugins
      - ./.borg-zones/core/claude-settings.json:/home/node/.claude/settings.json
    environment:
      - NODE_ENV=production
      - BORG_ZONE=core
      - ZONE_CONFIG_PATH=/app/zone-config.json
      - DEFAULT_CWD=${WORKSPACE_ROOT}
      - CREDENTIAL_BROKER_URL=http://broker:3000
      - BROKER_SECRET=${BROKER_SECRET}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - DEV_NETWORK=borg_dev
      - DOCKER_PROXY_URL=http://docker-proxy:2375/v1.47
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Perimeter: agent SDK sessions for untrusted threads ──
  perimeter:
    image: borg-agent:latest
    build: .
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      infra:
        condition: service_started
    volumes:
      - ./.borg-zones/perimeter:/app/.borg
      - ./threads.json:/app/threads.json
      - ./zone-config.json:/app/zone-config.json:ro
      - ./settings.json:/app/settings.json
      # Workspace access (AD7: per-zone host workspace, isolated from core)
      - ${WORKSPACE_HOST_BASE}/workspace-perimeter:${WORKSPACE_ROOT}
      # Credentials (limited)
      - ./secrets/github-installations.json:/secrets/github-installations.json:ro
      - ${CLAUDE_CREDENTIALS}:/home/node/.claude/.credentials.json
      - ./.borg-zones/perimeter/claude-skills:/home/node/.claude/skills
      - claude-plugins-perimeter:/home/node/.claude/plugins
      - ./.borg-zones/perimeter/claude-settings.json:/home/node/.claude/settings.json
      # NO SSH keys, NO docker-proxy access
    environment:
      - NODE_ENV=production
      - BORG_ZONE=perimeter
      - ZONE_CONFIG_PATH=/app/zone-config.json
      - DEFAULT_CWD=${WORKSPACE_ROOT}
      - CREDENTIAL_BROKER_URL=http://broker:3000
      - BROKER_SECRET=${BROKER_SECRET}
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G

  docker-proxy:
    image: wollomatic/socket-proxy:1
    group_add:
      - "${DOCKER_GID}"
    command:
      - "-listenip=0.0.0.0"
      - "-allowfrom=0.0.0.0/0"
      - "-allowhealthcheck"
      - "-allowGET=/v1\\..{1,2}/(containers/json.*|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(json|stats.*)|_ping)"
      - "-allowPOST=/v1\\..{1,2}/(containers/([a-f0-9]+/(update|start|stop)|create.*)|networks/.+/connect)"
      - "-allowDELETE=/v1\\..{1,2}/containers/[a-f0-9]+.*"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    restart: always
    depends_on:
      init:
        condition: service_completed_successfully
      infra:
        condition: service_started
      docker-proxy:
        condition: service_healthy
    volumes:
      # Primary view (core's .borg) — preserves single-zone code paths during migration
      - ./.borg-zones/core:/app/.borg:ro
      # Parent ro mount — used by dashboard for reading all zones
      - ./.borg-zones:/app/.borg-zones:ro
      # Parent rw mount — used ONLY for writing task-stop signals (Option B, AD plan)
      - ./.borg-zones:/app/.borg-zones-rw
      - ./.borg-infra:/app/.borg-infra:ro
      - ./threads.json:/app/threads.json:ro
      - ./zone-config.json:/app/zone-config.json:ro
      - ./settings.json:/app/settings.json:ro
      # Workspace browsing: host workspaces parent (rw so dashboard can mkdir per-zone workspaces on create)
      - ${WORKSPACE_HOST_BASE}:/host-workspaces
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - DOCKER_PROXY_URL=http://docker-proxy:2375/v1.47
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME:-borg}
      - WORKSPACE_HOST_BASE=${WORKSPACE_HOST_BASE}
      - WORKSPACE_ROOT=${WORKSPACE_ROOT}
      - BROKER_SECRET=${BROKER_SECRET}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - CLAUDE_CREDENTIALS=${CLAUDE_CREDENTIALS}
      - BORG_REPO_ROOT=${BORG_REPO_ROOT}
      - TASK_STOP_BASE=/app/.borg-zones-rw
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - speaches-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      - KOKORO__VOICES=bf_alice
      - WHISPER__COMPUTE_TYPE=int8
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - dashboard
    networks:
      - internal

networks:
  internal:
    driver: bridge
  dev:
    driver: bridge

volumes:
  speaches-cache:
  claude-plugins-core:
  claude-plugins-perimeter:
